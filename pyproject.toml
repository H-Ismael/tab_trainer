[tool.poetry]
name = "tabular-trainer"
version = "0.1.0"
description = "tabuar trainer api such as xgboost , svm, catboost or others"
authors = ["ismael "]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
# xgboost = "^2.0.3"
xgboost = {version = "^2.0.3", extras = ["gpu"]}
numpy = "^1.26.4"
pydantic = "^2.7.3"
scikit-learn = "^1.3.2"
optuna = "^2.10.0"
joblib = "^1.0.0"
pandas = "^2.1.2"
mlflow = "^2.9.2"
boto3 = "^1.34.15"
# torch = "^1.13.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
